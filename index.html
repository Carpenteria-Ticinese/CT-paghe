<style>
  :root { --acc:#e0a800; --acc-txt:#1c1c1c; --acc-scuro:#7a5200; --acc-ch:#fff4d6; --bg:#f4f6f8; --bord:#cfd5dc; --txt:#1c2733; --muted:#55606b;
          --rosso:#b42318; --rosso-ch:#fdecea; --verde:#1e7d34; --verde-ch:#e7f5ea; --giallo-ch:#fff4d6; --giallo:#7a5200; }

  body { margin:0; font-family:system-ui,Arial,sans-serif; background:var(--bg); color:var(--txt); font-size:17px; line-height:1.4; }
  header { background:var(--acc); color:var(--acc-txt); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { font-size:20px; margin:0; display:flex; align-items:center; gap:8px; }
  header h1 small { font-size:13px; font-weight:600; }
  header button { background:#fff; border:2px solid var(--acc-txt); color:var(--acc-txt); font-weight:700; padding:10px 14px; border-radius:8px; cursor:pointer; font-size:16px; min-height:44px; }

  .row > div { flex:1; min-width:120px; }
  .btn { background:var(--acc); color:var(--acc-txt); border:none; padding:12px 16px; border-radius:8px; font-size:17px; font-weight:700; cursor:pointer; min-height:48px; }
  .btn.sec { background:#eef0f4; color:var(--acc-scuro); border:1px solid var(--bord); }

  .schede { display:flex; gap:8px; margin-bottom:12px; }
  .schede button { flex:1; min-height:52px; font-size:16px; border-radius:10px; border:2px solid var(--acc-scuro); background:#fff; color:var(--acc-scuro); font-weight:700; cursor:pointer; padding:6px; }

  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--bord); font-size:15px; }
  th { color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:13px; font-weight:700; }
  .badge.aperto { background:var(--verde-ch); color:var(--verde); }
  .badge.chiuso { background:var(--rosso-ch); color:var(--rosso); }

  .msg.ok { background:var(--verde-ch); color:var(--verde); }

  .verif { display:inline-block; background:var(--giallo-ch); color:var(--giallo); border:1px solid #e9c46a; border-radius:6px; padding:1px 6px; font-size:13px; font-weight:700; margin-top:2px; }
  /* costo */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://wgidgbauhivdctdxfjnk.supabase.co";
const SUPA_KEY = "sb_publishable_Ke7MTQGHPYVXvKInfOrUQQ_Ys6qKJvD";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let periodo = null;   // riga tm_paghe_periodo corrente
let periodoArchivio = null;   // periodo di un ex in solo lettura: il motivo
let periodoNota = null;       // periodo di un ex che si può ancora scrivere (ultima busta): la scritta
let voci = [];        // voci del periodo
const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

const $ = (id) => document.getElementById(id);
const fmt = (n) => (Number(n) || 0).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const VERIF = `<span class="verif">⚠️ da verificare col fiduciario</span>`;

function msg(text, ok) {
  $("msgBox").innerHTML = text ? `<div class="msg ${ok ? "ok" : "err"}">${text}</div>` : "";
}

// ======================================================================
// CALCOLO (funzioni pure: nessun valore di legge scritto qui dentro;
// tutti i valori arrivano dalla tabella tm_paghe_parametri)
// ======================================================================
const ONERI = ["avs_ai_ipg","ad","assegni_familiari","integrativo_ti","spese_amm_avs","lainf_prof","igm","ccl_fondo_paritetico"];
const LPP_UNO = ["lpp_soglia_entrata","lpp_deduzione_coord","lpp_salario_max","lpp_coord_minimo","lpp_quota_azienda","lpp_rischio_azienda"];
const FASCE = ["lpp_accredito","lpp_rischio_dovuto","ferie_settimane"];
// solo i NOMI (per i messaggi quando un parametro manca); i valori stanno nel database
const NOMI_PARAMETRI = { avs_ai_ipg:"AVS/AI/IPG", ad:"Disoccupazione (AD)", assegni_familiari:"Assegni familiari", integrativo_ti:"Contributo integrativo Ticino",
  spese_amm_avs:"Spese amministrative cassa AVS", lainf_prof:"LAINF professionale", igm:"Indennità giornaliera malattia", ccl_fondo_paritetico:"Fondo paritetico CCL",
  lpp_soglia_entrata:"LPP soglia d'entrata", lpp_deduzione_coord:"LPP deduzione di coordinamento", lpp_salario_max:"LPP salario massimo", lpp_coord_minimo:"LPP coordinato minimo",
  lpp_quota_azienda:"LPP quota ditta", lpp_rischio_azienda:"LPP rischio e spese", tredicesima_ore:"13ª pagati a ore",
  lpp_accredito:"Accrediti LPP per età", lpp_rischio_dovuto:"Rischio LPP per età", ferie_settimane:"Ferie per età",
  ccl_ore_annue:"Ore annue CCL", ccl_min_mensile:"Salari minimi CCL" };
// Voci FUORI dalla base dei contributi (decisione Umberto 3.11: l'indennità forfettaria di trasferta/pasto no;
// il tempo di trasferta è orario di lavoro e sta già nelle ore). Entrano comunque nel costo per la ditta.
const TIPI_FUORI_BASE = ["indennita_trasferta"];
// Voci contate nella base ma dubbie: etichetta «da verificare col fiduciario»
const TIPI_DUBBI = ["altro"];

// arrotonda al centesimo (metà in su, anche coi numeri "storti" del binario)
function round2(x) {
  const n = Number(x) || 0;
  return Math.sign(n) * Math.round(Math.abs(n) * 100 + 1e-7) / 100;
}
function fmtPct(v) {
  return (Number(v) || 0).toLocaleString("it-IT", { maximumFractionDigits: 4 }) + "%";
}

// Per ogni codice (e fascia di età) prende la riga con valido_dal più recente <= primo giorno del mese.
function scegliParametri(righe, anno, mese) {
  const giorno = `${anno}-${String(mese).padStart(2, "0")}-01`;
  const migliori = {};
  for (const r of (righe || [])) {
    if (!r || !r.valido_dal || String(r.valido_dal).slice(0, 10) > giorno) continue;
    const k = [r.codice, r.categoria || "", r.eta_da == null ? "" : r.eta_da, r.anni_esperienza == null ? "" : r.anni_esperienza].join("|");
    if (!migliori[k] || String(r.valido_dal) > String(migliori[k].valido_dal)) migliori[k] = r;
  }
  const P = { uno: {}, fasce: {}, minimi: {}, giorno };
  for (const r of Object.values(migliori)) {
    const x = Object.assign({}, r, { valore: Number(r.valore), tetto_annuo: r.tetto_annuo == null ? null : Number(r.tetto_annuo) });
    if (x.codice === "ccl_min_mensile") {
      if (x.categoria && x.anni_esperienza != null) (P.minimi[x.categoria] = P.minimi[x.categoria] || {})[x.anni_esperienza] = x;
    } else if (x.eta_da == null) P.uno[x.codice] = x;
    else (P.fasce[x.codice] = P.fasce[x.codice] || []).push(x);
  }
  for (const k of Object.keys(P.fasce)) P.fasce[k].sort((a, b) => a.eta_da - b.eta_da);
  P.mancanti = [...ONERI, ...LPP_UNO, "tredicesima_ore"].filter(c => !P.uno[c]).concat(FASCE.filter(c => !P.fasce[c]));
  return P;
}
function fasciaPer(P, codice, eta) {
  return (P.fasce[codice] || []).find(f => eta >= f.eta_da && (f.eta_a == null || eta <= f.eta_a)) || null;
}
// età "di anno": anno del mese meno anno di nascita (come il foglio PARAMETRI: cambia l'anno, l'età segue)
function etaNelAnno(dataNascita, anno) {
  const m = /^(\d{4})-/.exec(String(dataNascita || ""));
  return m ? anno - parseInt(m[1], 10) : null;
}

// Anni pieni fra la data di assunzione e il primo giorno del mese (massimo 10 = «10 e più"); null se manca la data.
// periodi = periodi di rapporto chiusi (dopo un «Riattiva»): si sommano, il buco fra due periodi non conta.
// Serve solo all'avviso del minimo CCL: i soldi non passano di qui.
function anniDaAssunzione(dataAssunzione, anno, mese, periodi, fineAttuale) {
  if (periodi && periodi.length) return anniDiServizio(dataAssunzione, anno, mese, periodi, fineAttuale);
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(dataAssunzione || ""));
  if (!m) return null;
  let a = anno - parseInt(m[1], 10);
  if (mese < parseInt(m[2], 10) || (mese === parseInt(m[2], 10) && parseInt(m[3], 10) > 1)) a -= 1;
  return Math.max(0, Math.min(10, a));
}

// Mesi pieni e giorni di resto fra due date «AAAA-MM-GG» (la seconda esclusa)
function mesiEGiorni(da, a) {
  const [y1, m1, d1] = da.split("-").map(Number), [y2, m2, d2] = a.split("-").map(Number);
  let mesi = (y2 - y1) * 12 + (m2 - m1);
  if (d2 < d1) mesi -= 1;
  const giorni = Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1 + mesi, d1)) / 86400000);
  return [mesi, Math.max(0, giorni)];
}
// Somma i tratti lavorati fino al primo giorno del mese SCELTO (non oggi). Un periodo vecchio senza data di fine non si
// conta: non si sa quanto è durato. Se due tratti si sovrappongono, il pezzo comune conta una volta sola.
function anniDiServizio(dataAssunzione, anno, mese, periodi, fineAttuale) {
  const primo = `${anno}-${String(mese).padStart(2, "0")}-01`;
  const iso = (x) => x ? String(x).slice(0, 10) : null;
  const tratti = periodi.filter(p => p.data_inizio && p.data_fine).map(p => [iso(p.data_inizio), giornoDopo(iso(p.data_fine))]);
  if (dataAssunzione) tratti.push([iso(dataAssunzione), fineAttuale ? giornoDopo(iso(fineAttuale)) : primo]);
  tratti.sort((x, y) => (x[0] < y[0] ? -1 : 1));
  let mesi = 0, giorni = 0, finora = "";
  for (let [da, a] of tratti) {
    if (a > primo) a = primo;
    if (da < finora) da = finora;
    if (da >= a) continue;
    const [m, g] = mesiEGiorni(da, a);
    mesi += m; giorni += g; finora = a;
  }
  return Math.max(0, Math.min(10, Math.floor((mesi + Math.floor(giorni / 30)) / 12)));
}

// Avviso (mai blocco) se la paga è sotto il salario minimo CCL.
// inp: { tipo_salario, tariffa, ruolo, data_assunzione, occupazione, anno, mese }, mensile = somma voci «salario_mensile»
function controllaMinimo(inp, P, mensile) {
  const avvisi = [];
  const cats = Object.keys(P.minimi || {});
  if (!cats.length) return [{ testo: "Salari minimi CCL non caricati: controllo del minimo non fatto.", tipo: "info" }];
  const anni = anniDaAssunzione(inp.data_assunzione, inp.anno, inp.mese, inp.periodi, inp.data_fine_rapporto);
  const anniUsati = anni == null ? 0 : anni;
  const ruolo = String(inp.ruolo || "").trim();
  let cat = cats.find(c => c.toLowerCase() === ruolo.toLowerCase()) || null;
  let minRiga;
  if (cat) {
    minRiga = (P.minimi[cat] || {})[anniUsati];
  } else {
    avvisi.push({ testo: `Categoria CCL non indicata (ruolo «${ruolo || "vuoto"}»): controlla. Confronto con il minimo più basso del CCL.`, tipo: "err", verif: true });
    for (const c of cats) {
      const r = P.minimi[c][anniUsati];
      if (r && (!minRiga || r.valore < minRiga.valore)) { minRiga = r; }
    }
    cat = minRiga ? minRiga.categoria : null;
  }
  if (!minRiga) return avvisi.concat([{ testo: "Salario minimo CCL non trovato per questa categoria/anni.", tipo: "info" }]);
  const quandoAnni = anni == null ? "0 anni di esperienza (data di assunzione mancante)" : `almeno ${anniUsati}${anniUsati === 10 ? "+" : ""} anni (${inp.periodi && inp.periodi.length ? "periodi di lavoro sommati" : "dalla data di assunzione"})`;
  const occ = Number(inp.occupazione) > 0 ? Number(inp.occupazione) : 100;
  if (inp.tipo_salario === "orario" && inp.tariffa != null) {
    const ore = P.uno.ccl_ore_annue;
    if (!ore || !(ore.valore > 0)) return avvisi.concat([{ testo: "Ore annue CCL mancanti: minimo orario non controllato.", tipo: "info" }]);
    const minOra = minRiga.valore * 12 / ore.valore;
    if (Number(inp.tariffa) < minOra - 1e-9) {
      avvisi.push({ testo: `Tariffa sotto il minimo CCL (categoria ${cat}, ${quandoAnni}): ${fmt(inp.tariffa)} CHF/h, minimo ${fmt(round2(minOra))} CHF/h.`, tipo: "err", verif: true, sottoMinimo: true });
    }
  } else if (inp.tipo_salario === "mensile" && mensile > 0) {
    const minMese = minRiga.valore * occ / 100;
    if (mensile < minMese - 1e-9) {
      avvisi.push({ testo: `Salario sotto il minimo CCL (categoria ${cat}, ${quandoAnni}${occ !== 100 ? ", occupazione " + fmt(occ) + "%" : ""}): ${fmt(mensile)} CHF/mese, minimo ${fmt(round2(minMese))} CHF/mese.`, tipo: "err", verif: true, sottoMinimo: true });
    }
  }
  return avvisi;
}

// inp: { anno, mese, voci:[{tipo,importo}], tipo_salario, tariffa, data_nascita, ruolo, data_assunzione, occupazione }
// Regola 13ª (decisione Umberto 3.11): si MATURA ogni mese per tutti (orari e mensili) con la % del parametro.
// Una voce «13ª» nel mese è il PAGAMENTO di quanto già maturato: non aumenta il costo e non entra nella base.
function calcolaCosto(inp, P) {
  const out = { righe: [], avvisi: [], completo: true, lordoBase: 0, indennita: 0, t13pagata: 0, tredicesima: null, lordo: 0, contributi: 0, costo: 0, eta: null, ferie: null };
  const avv = (testo, tipo, verif) => out.avvisi.push({ testo, tipo: tipo || "err", verif: !!verif });
  const voci = inp.voci || [];
  if (P.mancanti && P.mancanti.length) {
    out.completo = false;
    avv("Parametri mancanti per questo mese: " + P.mancanti.map(c => NOMI_PARAMETRI[c] || c).join(", ") + ". Le righe relative non sono calcolate: avvisa il Direttore.");
  }
  const senza = voci.filter(v => v.importo == null || v.importo === "");
  if (senza.length) {
    out.completo = false;
    avv(`${senza.length} voce/i senza importo (es. tariffa oraria non impostata): il lordo è incompleto.`);
  }
  const somma = (arr) => round2(arr.reduce((s, v) => s + (Number(v.importo) || 0), 0));
  const soggette = voci.filter(v => !TIPI_FUORI_BASE.includes(v.tipo) && v.tipo !== "tredicesima");
  out.lordoBase = somma(soggette);
  out.indennita = somma(voci.filter(v => TIPI_FUORI_BASE.includes(v.tipo)));
  out.t13pagata = somma(voci.filter(v => v.tipo === "tredicesima"));
  if (!voci.length) {
    out.completo = false;
    avv("Nessuna voce e nessuna ora in questo mese: lordo zero.");
  }
  if (voci.some(v => TIPI_DUBBI.includes(v.tipo))) {
    avv("Voce «Altro» contata nella base dei contributi.", "info", true);
  }
  if (out.t13pagata) {
    avv(`13ª pagata questo mese: ${fmt(out.t13pagata)} CHF. Non aumenta il costo: è già maturata mese per mese.`, "info");
  }

  // 13ª maturata (tutti)
  const p13 = P.uno.tredicesima_ore;
  if (p13 && out.lordoBase) {
    out.tredicesima = { importo: round2(out.lordoBase * p13.valore / 100), det: `${fmtPct(p13.valore)} di ${fmt(out.lordoBase)}`, stato: p13.stato, nome: "13ª maturata nel mese" };
  }
  if (!inp.tipo_salario) {
    avv("Tipo di salario non impostato nell'anagrafica paghe.");
    out.completo = false;
  }
  out.lordo = round2(out.lordoBase + (out.tredicesima ? out.tredicesima.importo : 0));

  // Salario minimo CCL (solo avviso)
  const mensile = somma(voci.filter(v => v.tipo === "salario_mensile"));
  for (const a of controllaMinimo(inp, P, mensile)) out.avvisi.push(a);

  // Oneri sociali a carico della ditta
  for (const cod of ONERI) {
    const p = P.uno[cod];
    if (!p) continue;
    let base = out.lordo, notaTetto = "";
    if (p.tetto_annuo != null) {
      const t = round2(p.tetto_annuo / 12);
      if (base > t) { base = t; notaTetto = " (tetto mensile)"; }
    }
    out.righe.push({ codice: cod, nome: p.nome, det: `${fmtPct(p.valore)} di ${fmt(base)}${notaTetto}`, importo: round2(base * p.valore / 100), stato: p.stato });
  }

  // LPP
  out.eta = etaNelAnno(inp.data_nascita, inp.anno);
  const lpp = LPP_UNO.map(c => P.uno[c]);
  if (out.lordo > 0) {
    if (out.eta == null) {
      out.completo = false;
      avv("Manca la data di nascita (Anagrafiche → Persone → dati personali): LPP e ferie non calcolate.");
    } else if (lpp.every(Boolean)) {
      const [soglia, deduz, salMax, coordMin, quota, rischio] = lpp;
      const fAcc = fasciaPer(P, "lpp_accredito", out.eta);
      const fRis = fasciaPer(P, "lpp_rischio_dovuto", out.eta);
      const annuo = round2(out.lordo * 12);
      if (!fAcc || !fRis) {
        out.completo = false;
        avv(`Nessuna fascia LPP per l'età ${out.eta}: LPP non calcolata.`);
      } else if (annuo < soglia.valore) {
        avv(`LPP: salario annuo stimato ${fmt(annuo)} sotto la soglia d'entrata: niente LPP.`, "info");
      } else {
        const coord = round2(Math.max(Math.min(annuo, salMax.valore) - deduz.valore, coordMin.valore));
        const daVer = (...xs) => xs.some(x => x && x.stato === "da_verificare") ? "da_verificare" : "verificato";
        const statoBase = daVer(soglia, deduz, salMax, coordMin);
        if (fAcc.valore > 0) {
          out.righe.push({ codice: "lpp_accredito", nome: `LPP accredito di vecchiaia, quota ditta (età ${out.eta})`,
            det: `${fmtPct(fAcc.valore)} × ${fmtPct(quota.valore)} di coordinato ${fmt(coord)}/anno, ÷ 12`,
            importo: round2(coord * fAcc.valore / 100 * quota.valore / 100 / 12),
            stato: daVer(fAcc, quota) === "da_verificare" || statoBase === "da_verificare" ? "da_verificare" : "verificato" });
        } else {
          avv(`LPP: a ${out.eta} anni nessun accredito di vecchiaia.`, "info");
        }
        if (Number(fRis.valore) === 1) {
          out.righe.push({ codice: "lpp_rischio_azienda", nome: "LPP rischio e spese, quota ditta",
            det: `${fmtPct(rischio.valore)} di coordinato ${fmt(coord)}/anno, ÷ 12`,
            importo: round2(coord * rischio.valore / 100 / 12),
            stato: daVer(fRis, rischio) === "da_verificare" || statoBase === "da_verificare" ? "da_verificare" : "verificato" });
        } else {
          avv(`LPP: a ${out.eta} anni nessun premio di rischio.`, "info");
        }
      }
    }
  }

  // Ferie maturate (informazione, non entra nel costo)
  if (out.eta != null) {
    const f = fasciaPer(P, "ferie_settimane", out.eta);
    if (f) out.ferie = { settimane: f.valore, giorniMese: round2(f.valore * 5 / 12), stato: f.stato };
  }

  out.contributi = round2(out.righe.reduce((s, r) => s + r.importo, 0));
  out.costo = round2(out.lordo + out.indennita + out.contributi);
  return out;
}

// HTML del dettaglio di una persona (usato nel mese e nel periodo)
function htmlCosto(c) {
  const st = (s) => s === "da_verificare" ? "<br>" + VERIF : "";
  let h = `<div class="riga"><span class="sx">Salario del mese<span class="det">voci soggette a contributi</span></span><span class="dx">${fmt(c.lordoBase)}</span></div>`;
  if (c.tredicesima) {
    h += `<div class="riga"><span class="sx">${esc(c.tredicesima.nome)}<span class="det">${esc(c.tredicesima.det)}</span>${st(c.tredicesima.stato)}</span><span class="dx">${fmt(c.tredicesima.importo)}</span></div>`;
  }
  h += `<div class="riga"><span class="sx"><b>Lordo soggetto</b><span class="det">base dei contributi</span></span><span class="dx"><b>${fmt(c.lordo)}</b></span></div>`;
  h += `<div class="sottotitolo">Contributi a carico della ditta</div>`;
  if (!c.righe.length) h += `<div class="msg err">Nessun contributo calcolato (vedi avvisi).</div>`;
  for (const r of c.righe) {
    h += `<div class="riga"><span class="sx">${esc(r.nome)}<span class="det">${esc(r.det)}</span>${st(r.stato)}</span><span class="dx">${fmt(r.importo)}</span></div>`;
  }
  h += `<div class="riga"><span class="sx">Totale contributi ditta</span><span class="dx">${fmt(c.contributi)}</span></div>`;
  if (c.indennita) {
    h += `<div class="riga"><span class="sx">Indennità forfettarie (trasferta / pasto)<span class="det">fuori dalla base dei contributi</span>${"<br>" + VERIF}</span><span class="dx">${fmt(c.indennita)}</span></div>`;
  }
  h += `<div class="riga totale"><span class="sx">Costo per la ditta</span><span class="dx">${fmt(c.costo)} CHF</span></div>`;
  if (c.ferie) {
    h += `<div class="msg info">🏖️ Ferie: ${fmt(c.ferie.settimane)} settimane l'anno → ${fmt(c.ferie.giorniMese)} giorni maturati nel mese${c.ferie.stato === "da_verificare" ? "<br>" + VERIF : ""}</div>`;
  }
  for (const a of c.avvisi) h += `<div class="msg ${a.tipo === "info" ? "info" : "err"}">${a.tipo === "info" ? "ℹ️" : "⚠️"} ${esc(a.testo)}${a.verif ? "<br>" + VERIF : ""}</div>`;
  if (!c.completo) h += `<div class="msg err">⚠️ Stima INCOMPLETA: mancano dati (vedi sopra).</div>`;
  return h;
}

// ======================================================================
// ARCHIVIO (fine rapporto passata, o scheda con attivo = false: stessa regola di Anagrafiche)
// L'ultimo giorno di lavoro è ancora attivo. La data è quella svizzera, non UTC.
// Elenchi di lavoro = secondo OGGI. Costo del mese = secondo il MESE SCELTO.
// ======================================================================
function oggiSvizzera(adesso) {
  const parti = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Zurich", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(adesso || new Date());
  const v = (t) => parti.find(p => p.type === t).value;
  return `${v("year")}-${v("month")}-${v("day")}`;
}
function fineRapporto(o) { return o && o.data_fine_rapporto ? String(o.data_fine_rapporto).slice(0, 10) : null; }
function inArchivio(o, oggi) {
  if (!o) return false;
  const fine = fineRapporto(o);
  return o.attivo === false || (!!fine && fine < (oggi || oggiSvizzera()));
}
function giornoDopo(iso) {
  const [a, m, g] = iso.split("-").map(Number);
  return new Date(Date.UTC(a, m - 1, g + 1)).toISOString().slice(0, 10);
}
function dataCH(iso) { return iso.split("-").reverse().join("."); }
// «In archivio dal …» = dal giorno dopo l'ultimo giorno. Tolta con attivo = false senza data: niente data.
function testoArchivio(o, oggi) {
  const fine = fineRapporto(o);
  return fine && fine < (oggi || oggiSvizzera()) ? `In archivio dal ${dataCH(giornoDopo(fine))}` : "In archivio";
}
function badgeArchivio(o, oggi) { return `<span class="badge archivio">🗄️ ${esc(testoArchivio(o, oggi))}</span>`; }
// L'ultimo giorno viene prima del mese scelto?
function uscitoPrimaDelMese(o, anno, mese) {
  const fine = fineRapporto(o);
  return !!fine && fine < `${anno}-${String(mese).padStart(2, "0")}-01`;
}
// Un ex si può ancora scrivere fino al mese della fine rapporto compreso: l'ultima busta si fa dopo l'uscita.
// Ritorna il motivo per cui quel mese è solo lettura, o null se si può scrivere.
// attivo = false senza data: non si sa quando è uscito, sempre solo lettura.
function motivoArchivio(o, anno, mese) {
  if (!inArchivio(o)) return null;
  const fine = fineRapporto(o);
  if (!fine) return `${testoArchivio(o)}, senza data di fine: solo lettura.`;
  if (uscitoPrimaDelMese(o, anno, mese)) return `${testoArchivio(o)}: ${MESI[mese - 1]} ${anno} è dopo l'ultimo giorno (${dataCH(fine)}), solo lettura.`;
  return null;
}
function ultimoMeseScrivibile(o) {
  const [a, m] = fineRapporto(o).split("-").map(Number);
  return `${MESI[m - 1]} ${a}`;
}
// Il mese tocca un periodo di lavoro? Serve solo a chi ha periodi vecchi (dopo un «Riattiva»).
function nelRapporto(o, periodi, anno, mese) {
  const m = String(mese).padStart(2, "0");
  const primo = `${anno}-${m}-01`, ultimo = `${anno}-${m}-${String(new Date(Date.UTC(anno, mese, 0)).getUTCDate()).padStart(2, "0")}`;
  const iso = (x) => x ? String(x).slice(0, 10) : null;
  const tocca = (da, a) => (!da || iso(da) <= ultimo) && (!a || iso(a) >= primo);
  const attuale = o.attivo === false && !fineRapporto(o) ? false : tocca(o.data_assunzione, o.data_fine_rapporto);
  return attuale || periodi.some(p => tocca(p.data_inizio, p.data_fine));
}
// Chi conta nel Costo del mese scelto. haDati = ha un periodo o ore in quel mese: i dati non spariscono mai.
function presenteNelMese(o, anno, mese, haDati, periodi) {
  if (haDati) return true;
  if (periodi && periodi.length) return nelRapporto(o, periodi, anno, mese);
  if (fineRapporto(o)) return !uscitoPrimaDelMese(o, anno, mese);
  return o.attivo !== false;
}

// ======================================================================
// LETTURE
// ======================================================================
function erroreTabella(e) {
  const t = ((e && e.code) || "") + " " + ((e && e.message) || "");
  return /42P01|PGRST205|does not exist|schema cache/i.test(t);
}
async function leggiParametri() {
  const { data, error } = await sb.from("tm_paghe_parametri")
    .select("codice,nome,gruppo,valore,unita,base,tetto_annuo,eta_da,eta_a,categoria,anni_esperienza,chi_paga,stato,fonte,nota,valido_dal");
  if (error) {
    if (erroreTabella(error)) throw new Error("Tabella dei parametri (tm_paghe_parametri) mancante nel database: i contributi non si possono calcolare. Avvisa il Direttore.");
    throw error;
  }
  if (!data || !data.length) throw new Error("Nessun parametro leggibile (tabella vuota o accesso negato: solo il titolare vede Paghe). I contributi non si possono calcolare.");
  return data;
}
// Periodi di rapporto chiusi (ANAG_10), solo le date. Servono all'avviso del minimo e ai mesi del buco, mai ai soldi.
// Tabella assente (database senza ANAG_10): si conta come prima, nessun errore a schermo, una sola prova per pagina.
let periodiTabellaAssente = false;
async function leggiPeriodiRapporto(ids) {
  if (periodiTabellaAssente || !ids.length) return { per: {}, errore: null };
  try {
    const { data, error } = await sb.from("anag_periodi_rapporto").select("operaio_id,data_inizio,data_fine").in("operaio_id", ids);
    if (error) {
      if (erroreTabella(error)) { periodiTabellaAssente = true; return { per: {}, errore: null }; }
      return { per: {}, errore: error.message || String(error) };
    }
    const per = {};
    for (const r of (data || [])) (per[r.operaio_id] = per[r.operaio_id] || []).push(r);
    return { per, errore: null };
  } catch (e) {
    return { per: {}, errore: e.message || String(e) };
  }
}
const AVVISO_PERIODI = "Periodi vecchi non letti: anni di servizio contati dalla data di assunzione. I soldi non cambiano.";

async function leggiPersona(operaio_id) {
  const [an, dp, op, pr] = await Promise.all([
    sb.from("tm_paghe_anagrafica").select("operaio_id,tipo_salario,tariffa,percentuale_occupazione").eq("operaio_id", operaio_id).maybeSingle(),
    sb.from("operai_dati_personali").select("operaio_id,data_nascita,permesso_tipo").eq("operaio_id", operaio_id).maybeSingle(),
    sb.from("operai").select("id,ruolo,data_assunzione,data_fine_rapporto").eq("id", operaio_id).maybeSingle(),
    leggiPeriodiRapporto([operaio_id])
  ]);
  if (an.error) throw an.error;
  if (dp.error) throw dp.error;
  if (op.error) throw op.error;
  return { anag: an.data, dati: dp.data, op: op.data, periodi: pr.per[operaio_id] || [], erroreP: pr.errore };
}
// Tariffe dell'indennità pasto: impostazioni dell'App Cantieri (sola lettura). Nessun valore scritto qui.
async function leggiTariffePasti() {
  const { data, error } = await sb.from("impostazioni").select("chiave,valore").in("chiave", ["pasti_abilitati", "pasto_carpentiere", "pasto_lattoniere"]);
  if (error) throw error;
  const m = Object.fromEntries((data || []).map(r => [r.chiave, r.valore]));
  const n = (x) => (x != null && x !== "" && !isNaN(parseFloat(x))) ? parseFloat(x) : null;
  return { abilitati: m.pasti_abilitati === "1", carpentiere: n(m.pasto_carpentiere), lattoniere: n(m.pasto_lattoniere) };
}
// stessa regola dell'App Cantieri: ruolo con «lattoniere» → tariffa lattoniere, altrimenti carpentiere
function tariffaPasto(ruolo, T) {
  if (!T || !T.abilitati) return null;
  return String(ruolo || "").toLowerCase().includes("lattoniere") ? T.lattoniere : T.carpentiere;
}

// ======================================================================
// SCHEDA «COSTO DEL MESE»
// ======================================================================
function mostraScheda(n) { if (vista.s !== n) vaiA(n, null); }   // tasto in alto: un passo nella storia

// ======================================================================
// TASTO INDIETRO (mouse, tastiera, telefono)
// Ogni schermata è un passo nella storia del browser (indirizzo con #):
//   #costo · #costo/risultato · #costo/dettaglio · #registra · #registra/periodo
// Indietro torna alla schermata precedente dentro l'app. Non si perde niente:
// se c'è una voce scritta e non aggiunta, Indietro chiede conferma.
// ======================================================================
const SCHERMATE = { costo: ["risultato", "dettaglio"], registra: ["periodo"] };
let vista = { s: "costo", v: null };   // schermata attuale
let ultimoDettaglio = null;          // l'ultimo dettaglio (dipendente/parametri) aperto con un tocco
let navInCorso = false;                // true mentre si applica un «indietro»: non si ripusha

function indirizzoVista(s, v) { return "#" + s + (v ? "/" + v : ""); }

// Mostra la schermata SENZA toccare la storia
function applicaVista(s, v) {
  if (!SCHERMATE[s]) { s = "costo"; v = null; }
  if (v && !SCHERMATE[s].includes(v)) v = null;
  // registra/periodo e costo/risultato esistono solo se i dati sono stati caricati
  if (s === "registra" && v === "periodo" && !periodo) v = null;
  if (s === "costo" && v && !$("costoRiepilogo").innerHTML && !$("costoMsg").innerHTML) v = null;
  vista = { s, v };
  $("schedaCosto").classList.toggle("hidden", s !== "costo");
  $("schedaRegistra").classList.toggle("hidden", s !== "registra");
  $("tabCosto").classList.toggle("attiva", s === "costo");
  $("tabRegistra").classList.toggle("attiva", s === "registra");
  $("tabCosto").setAttribute("aria-current", s === "costo" ? "page" : "false");
  $("tabRegistra").setAttribute("aria-current", s === "registra" ? "page" : "false");
  $("costoRisultato").classList.toggle("hidden", !(s === "costo" && v));
  $("periodoCard").classList.toggle("hidden", !(s === "registra" && v === "periodo"));
  if (s === "costo" && v === "dettaglio") {
    // avanti nella storia: si riapre l'ultimo dettaglio aperto
    if (!document.querySelector("#costoRisultato details.persona[open]") && ultimoDettaglio && ultimoDettaglio.isConnected) {
      ultimoDettaglio.setAttribute("open", ""); ultimoDettaglio.dataset.mio = "1";
    }
  } else {
    document.querySelectorAll("#costoRisultato details.persona[data-mio]").forEach(d => { d.removeAttribute("open"); delete d.dataset.mio; });
  }
}

// Va a una schermata e la mette nella storia (se è cambiata)
function vaiA(s, v, sostituisci) {
  if (navInCorso) return;
  if (!sostituisci && vista.s === s && vista.v === (v || null)) return;
  applicaVista(s, v || null);
  try {
    const st = { app: "paghe", s: vista.s, v: vista.v };
    if (sostituisci) history.replaceState(st, "", indirizzoVista(vista.s, vista.v));
    else history.pushState(st, "", indirizzoVista(vista.s, vista.v));
  } catch (e) { /* senza storia si naviga lo stesso */ }
}

// C'è una voce scritta e non ancora aggiunta?
function voceNonSalvata() {
  return !!periodo && vista.s === "registra" && vista.v === "periodo" &&
    ["vDesc", "vQta", "vUm", "vImp"].some(id => String($(id).value || "").trim() !== "");
}

window.addEventListener("popstate", (ev) => {
  if ($("app").classList.contains("hidden")) return;            // login: niente da fare
  let st = ev.state;
  if (!st || st.app !== "paghe") {                               // voce senza stato: si legge l'indirizzo
    const m = /^#(\w+)(?:\/(\w+))?$/.exec(location.hash || "");
    st = m ? { s: m[1], v: m[2] || null } : { s: "costo", v: null };
  }
  // Si esce dal dettaglio del dipendente con una voce non aggiunta: conferma, senza perdere nulla.
  if (voceNonSalvata() && !(st.s === "registra" && st.v === "periodo")) {
    if (!confirm("Hai scritto una voce che non hai ancora aggiunto. Se esci la perdi. Uscire lo stesso?")) {
      try { history.pushState({ app: "paghe", s: vista.s, v: vista.v }, "", indirizzoVista(vista.s, vista.v)); } catch (e) {}
      return;
    }
    ["vDesc", "vQta", "vUm", "vImp"].forEach(id => { $(id).value = ""; });
  }
  navInCorso = true;
  try { applicaVista(st.s, st.v || null); } finally { navInCorso = false; }
});
window.addEventListener("beforeunload", (e) => { if (voceNonSalvata()) { e.preventDefault(); e.returnValue = ""; } });
// aprire il dettaglio di un dipendente (o dei parametri) con un tocco = un passo nella storia
document.addEventListener("click", (e) => {
  const sm = e.target && e.target.closest ? e.target.closest("#costoRisultato details.persona > summary") : null;
  if (!sm || sm.parentElement.open) return;            // solo l'apertura (a questo punto il dettaglio è ancora chiuso)
  sm.parentElement.dataset.mio = "1";

  if (vista.s === "costo" && vista.v === "risultato") vaiA("costo", "dettaglio");
});

async function calcolaMese() {
  const anno = parseInt($("cAnno").value, 10), mese = parseInt($("cMese").value, 10);
  $("costoMsg").innerHTML = `<div class="msg info">Calcolo in corso…</div>`;
  vaiA("costo", "risultato");
  $("costoRiepilogo").innerHTML = ""; $("costoPersone").innerHTML = ""; $("costoAgenzia").innerHTML = ""; $("costoParametri").innerHTML = "";
  if (!anno || !mese) { $("costoMsg").innerHTML = `<div class="msg err">Scegli anno e mese.</div>`; return; }
  try {
    const parRighe = await leggiParametri();
    const P = scegliParametri(parRighe, anno, mese);

    // Tutti i Dipendenti, anche gli ex: chi conta si decide sul MESE SCELTO, non su oggi (attivo non basta).
    const { data: dipendenti, error: eo } = await sb.from("operai").select("id,nome,cognome,ruolo,agenzia,nome_agenzia,data_assunzione,attivo,data_fine_rapporto")
      .eq("rapporto", "dipendente").order("cognome");
    if (eo) throw new Error(erroreRapporto(eo) || eo.message);
    if (!dipendenti || !dipendenti.length) throw new Error("Nessun dipendente trovato (accesso negato o dati mancanti). Entra con l'account del titolare.");
    const ids = dipendenti.map(o => o.id);

    const { start, end } = meseRange(anno, mese);
    const [rPer, rAn, rDp, rGio, rPr] = await Promise.all([
      sb.from("tm_paghe_periodo").select("id,operaio_id,stato").eq("anno", anno).eq("mese", mese).in("operaio_id", ids),
      sb.from("tm_paghe_anagrafica").select("operaio_id,tipo_salario,tariffa,percentuale_occupazione").in("operaio_id", ids),
      sb.from("operai_dati_personali").select("operaio_id,data_nascita,permesso_tipo").in("operaio_id", ids),
      sb.from("giornate").select("operaio_id,data,ore_totali,ore_straordinari,pasto_riconosciuto").in("operaio_id", ids).gte("data", start).lte("data", end),
      leggiPeriodiRapporto(ids)
    ]);
    for (const r of [rPer, rAn, rDp, rGio]) if (r.error) throw r.error;
    const periodiDi = (id) => rPr.per[id] || [];
    const conDati = new Set([...(rPer.data || []), ...(rGio.data || [])].map(x => x.operaio_id));
    const tutti = dipendenti.filter(o => presenteNelMese(o, anno, mese, conDati.has(o.id), periodiDi(o.id)));
    const usciti = dipendenti.length - tutti.length;
    const ops = tutti.filter(o => o.agenzia !== true);       // buste nostre
    const agenz = tutti.filter(o => o.agenzia === true);     // busta fatta dall'agenzia
    const oggi = oggiSvizzera();
    let TP = null, errPasti = null;
    try { TP = await leggiTariffePasti(); } catch (e) { errPasti = e.message || String(e); }
    const per = rPer.data || [];
    let vociMese = [];
    if (per.length) {
      const rV = await sb.from("tm_paghe_voce").select("periodo_id,tipo,importo").in("periodo_id", per.map(p => p.id));
      if (rV.error) throw rV.error;
      vociMese = rV.data || [];
    }
    const byOp = (arr) => Object.fromEntries((arr || []).map(x => [x.operaio_id, x]));
    const mPer = byOp(per), mAn = byOp(rAn.data), mDp = byOp(rDp.data);
    const gioDi = (id) => (rGio.data || []).filter(g => g.operaio_id === id);

    const risultati = ops.map(o => {
      const an = mAn[o.id] || null, dp = mDp[o.id] || null, p = mPer[o.id] || null;
      let vv, origine, extra = [];
      if (p) {
        vv = vociMese.filter(v => v.periodo_id === p.id);
        origine = `Voci del periodo (${p.stato === "chiuso" ? "chiuso" : "aperto"})`;
      } else {
        const gg = gioDi(o.id);
        const ore = round2(gg.reduce((s, g) => s + (Number(g.ore_totali) || 0), 0));
        const pasti = gg.filter(g => g.pasto_riconosciuto === true).length;
        origine = "Periodo non aperto: stima dalle ore del Cantiere";
        vv = [];
        if (ore > 0) {
          const imp = an && an.tipo_salario === "orario" && an.tariffa != null ? round2(ore * Number(an.tariffa)) : null;
          vv.push({ tipo: "ore_ordinarie", importo: imp });
          extra.push({ testo: `${fmt(ore)} ore dal Cantiere${imp == null ? ` (manca la tariffa oraria o il dipendente è mensile: ${motivoArchivio(o, anno, mese) ? "è in archivio, solo lettura" : inArchivio(o, oggi) ? "apri il periodo da «Mostra archivio»" : "apri il periodo"})` : " × tariffa"}.`, tipo: imp == null ? "err" : "info" });
        }
        if (pasti > 0) {
          const tar = tariffaPasto(o.ruolo, TP);
          vv.push({ tipo: "indennita_trasferta", importo: tar == null ? null : round2(pasti * tar) });
          extra.push({ testo: `${pasti} pasti riconosciuti dal Cantiere${tar == null ? " (tariffa pasto non impostata nell'App Cantieri)" : ""}.`, tipo: tar == null ? "err" : "info" });
        }
      }
      const c = calcolaCosto({ anno, mese, voci: vv, tipo_salario: an ? an.tipo_salario : null, tariffa: an ? an.tariffa : null,
        occupazione: an ? an.percentuale_occupazione : null, data_nascita: dp ? dp.data_nascita : null,
        ruolo: o.ruolo, data_assunzione: o.data_assunzione, data_fine_rapporto: o.data_fine_rapporto, periodi: periodiDi(o.id) }, P);
      if (!an) { c.completo = false; c.avvisi.unshift({ testo: "Anagrafica paghe mancante (tipo di salario e tariffa).", tipo: "err" }); }
      c.avvisi.unshift(...extra);
      // qui fuori rapporto solo se ha un periodo o ore in questo mese
      const dopoFine = uscitoPrimaDelMese(o, anno, mese);
      const nelBuco = !dopoFine && periodiDi(o.id).length > 0 && !nelRapporto(o, periodiDi(o.id), anno, mese);
      const fuori = dopoFine || nelBuco;
      if (fuori) c.avvisi.unshift({ testo: `${dopoFine ? "Ultimo giorno " + dataCH(fineRapporto(o)) + ", ma in questo mese" : "In questo mese era fuori rapporto, ma"} ${p ? "c'è un periodo" : "ci sono ore dal Cantiere"}: controlla. Il costo è contato.`, tipo: "err" });
      return { o, c, origine, fuori, permesso: dp ? dp.permesso_tipo : null };
    });

    const T = risultati.reduce((s, r) => ({ lordo: s.lordo + r.c.lordo, ind: s.ind + r.c.indennita, contr: s.contr + r.c.contributi, costo: s.costo + r.c.costo }), { lordo: 0, ind: 0, contr: 0, costo: 0 });
    const incompleti = risultati.filter(r => !r.c.completo).length;
    const sottoMin = risultati.filter(r => r.c.avvisi.some(a => a.sottoMinimo)).length;
    const dopoFine = risultati.filter(r => r.fuori).length;
    const daVer = risultati.some(r => r.c.righe.some(x => x.stato === "da_verificare") || (r.c.tredicesima && r.c.tredicesima.stato === "da_verificare"));
    $("costoMsg").innerHTML = "";
    $("costoRiepilogo").innerHTML = `<div class="riepilogo">
      <div class="muted">Costo del personale · ${MESI[mese - 1]} ${anno} · ${risultati.length} dipendenti${agenz.length ? " · " + agenz.length + " in agenzia a parte" : ""}</div>
      <div class="grande">${fmt(round2(T.costo))} CHF</div>
      <div class="riga"><span class="sx">Lordo soggetto totale</span><span class="dx">${fmt(round2(T.lordo))}</span></div>
      <div class="riga"><span class="sx">Contributi ditta totali</span><span class="dx">${fmt(round2(T.contr))}</span></div>
      ${T.ind ? `<div class="riga"><span class="sx">Indennità forfettarie</span><span class="dx">${fmt(round2(T.ind))}</span></div>` : ""}
      ${daVer ? `<div style="margin-top:6px">${VERIF} <span class="muted">alcune percentuali</span></div>` : ""}
      ${incompleti ? `<div class="msg err">⚠️ ${incompleti} dipendente/i con stima INCOMPLETA: apri il nome per vedere cosa manca.</div>` : ""}
      ${sottoMin ? `<div class="msg err">⚠️ ${sottoMin} dipendente/i sotto il minimo CCL: apri il nome.</div>` : ""}
      ${dopoFine ? `<div class="msg err">⚠️ ${dopoFine} con periodo o ore fuori dal rapporto di lavoro: apri il nome.</div>` : ""}
      ${rPr.errore ? `<div class="msg info">ℹ️ ${esc(AVVISO_PERIODI)}</div>` : ""}
      ${usciti ? `<div class="muted" style="margin-top:6px">🗄️ ${usciti} ${usciti === 1 ? "uscito" : "usciti"} prima di questo mese: non ${usciti === 1 ? "contato" : "contati"}.</div>` : ""}
    </div>`;
    $("costoPersone").innerHTML = risultati.length ? risultati.map(r => `
      <details class="persona"${r.c.completo && !r.fuori && !r.c.avvisi.some(a => a.sottoMinimo) ? "" : " open"}>
        <summary><span><span class="nome">${esc((r.o.cognome || "") + " " + (r.o.nome || ""))}</span><br><span class="muted">${r.c.eta != null ? "età " + r.c.eta : "età ?"}${r.permesso ? " · permesso " + esc(r.permesso) : ""}${r.c.completo ? "" : " · ⚠️ incompleta"}${r.c.avvisi.some(a => a.sottoMinimo) ? " · ⚠️ sotto minimo" : ""}</span>${inArchivio(r.o, oggi) ? "<br>" + badgeArchivio(r.o, oggi) : ""}</span>
          <span class="cifra">${fmt(r.c.costo)}</span></summary>
        <div class="corpo"><div class="muted">${esc(r.origine)}</div>${htmlCosto(r.c)}</div>
      </details>`).join("") : `<div class="msg info">${agenz.length ? "Nessun dipendente con busta nostra: sono tutti in agenzia." : "Nessun dipendente in questo mese."}</div>`;
    $("costoAgenzia").innerHTML = htmlAgenzia(agenz, gioDi, TP, errPasti, mese, anno);
    $("costoParametri").innerHTML = htmlParametri(P);
  } catch (e) {
    $("costoMsg").innerHTML = `<div class="msg err">⚠️ ${esc(e.message || e)}</div>`;
  }
}

// Persone in agenzia: la busta la fa l'agenzia. Qui solo ore e pasti da mandare, per controllare la fattura.
function riepilogoAgenzia(gg, ruolo, TP) {
  const ore = round2(gg.reduce((s, g) => s + (Number(g.ore_totali) || 0), 0));
  const str = round2(gg.reduce((s, g) => s + (Number(g.ore_straordinari) || 0), 0));
  const giorni = new Set(gg.map(g => g.data)).size;
  const pasti = gg.filter(g => g.pasto_riconosciuto === true).length;
  const tar = tariffaPasto(ruolo, TP);
  return { ore, str, giorni, pasti, tar, importoPasti: tar == null ? null : round2(pasti * tar) };
}
function htmlAgenzia(agenz, gioDi, TP, errPasti, mese, anno) {
  if (!agenz.length) return "";
  let h = `<div class="card"><div class="nome" style="font-weight:800;font-size:18px">👷 Agenzia — da mandare all'agenzia</div>
    <div class="muted">${MESI[mese - 1]} ${anno} · ore e pasti dal Cantiere. Il costo di queste persone per la ditta è la fattura dell'agenzia (fuori da Paghe): qui non c'è nessun contributo.</div>`;
  if (errPasti) h += `<div class="msg err">⚠️ Tariffe pasto non leggibili: ${esc(errPasti)}</div>`;
  else if (TP && !TP.abilitati) h += `<div class="msg info">ℹ️ Indennità pasti non attive nell'App Cantieri.</div>`;
  for (const o of agenz) {
    const r = riepilogoAgenzia(gioDi(o.id), o.ruolo, TP);
    h += `<div class="persona" style="padding:10px 14px">
      <div class="nome" style="font-weight:700">${esc((o.cognome || "") + " " + (o.nome || ""))}</div>
      ${inArchivio(o) ? `<div>${badgeArchivio(o)}</div>` : ""}
      <div class="muted">${o.nome_agenzia ? "Agenzia: " + esc(o.nome_agenzia) : "⚠️ nome dell'agenzia non indicato (Anagrafiche)"}</div>
      <div class="riga"><span class="sx">Giorni lavorati</span><span class="dx">${r.giorni}</span></div>
      <div class="riga"><span class="sx">Ore lavorate</span><span class="dx">${fmt(r.ore)} h</span></div>
      <div class="riga"><span class="sx">Straordinari segnati</span><span class="dx">${fmt(r.str)} h</span></div>
      <div class="riga"><span class="sx">Pasti riconosciuti${r.tar != null ? `<span class="det">${r.pasti} × ${fmt(r.tar)} CHF</span>` : ""}</span><span class="dx">${r.pasti}${r.importoPasti != null ? " = " + fmt(r.importoPasti) + " CHF" : ""}</span></div>
      ${r.giorni === 0 ? `<div class="msg info">ℹ️ Nessuna giornata nel Cantiere in questo mese.</div>` : ""}
      ${r.pasti > 0 && r.tar == null ? `<div class="msg err">⚠️ Tariffa pasto non impostata nell'App Cantieri: importo pasti da calcolare.</div>` : ""}
    </div>`;
  }
  return h + `</div>`;
}

function htmlParametri(P) {
  const tutte = [...Object.values(P.uno), ...Object.values(P.fasce).flat(), ...Object.values(P.minimi || {}).flatMap(o => Object.values(o))];
  const dv = tutte.filter(r => r.stato === "da_verificare");
  const nomi = [...new Set(dv.map(r => r.gruppo === "lpp_eta" ? "Accrediti LPP per età" : r.gruppo === "ferie_eta" ? "Ferie per età"
                                     : r.codice === "ccl_min_mensile" ? "Salari minimi CCL" : r.nome))];
  return `<details class="persona"><summary><span><span class="nome">📋 Parametri usati</span><br><span class="muted">${tutte.length} valori validi al ${esc(P.giorno.split("-").reverse().join("."))} · ${dv.length} da verificare</span></span></summary>
    <div class="corpo">
      ${nomi.length ? `<div class="sottotitolo">Da verificare col fiduciario</div>` + nomi.map(n => `<div class="riga"><span class="sx">${esc(n)}<br>${VERIF}</span></div>`).join("") : ""}
      <div class="muted" style="margin-top:8px">Fonte: foglio PARAMETRI del file costi di Umberto, caricato nel database. Per cambiarli si aggiorna il file e si ricarica (Direttore).</div>
    </div></details>`;
}

// ---- AUTH ----
async function checkAuth() {
  try {
    const { data } = await sb.auth.getSession();
    if (data.session) { showApp(); } else { showLogin(); }
  } catch (e) { showLogin(); }
}
function showLogin() { $("authCard").classList.remove("hidden"); $("app").classList.add("hidden"); $("btnLogout").classList.add("hidden"); }
function showApp() {
  $("authCard").classList.add("hidden"); $("app").classList.remove("hidden"); $("btnLogout").classList.remove("hidden");
  initControls(); loadOperai();
  // ricarico con un # (collegamento diretto): si apre la schermata; il dettaglio no (non ci sono ancora i dati)
  const m = /^#(\w+)/.exec(location.hash || "");
  vaiA(m && SCHERMATE[m[1]] ? m[1] : "costo", null, true);
}
let loginInCorso = false;
function loginSubmit(ev) { if (ev) ev.preventDefault(); login(); return false; }   // Invio = Entra (un solo invio alla volta)
async function login() {
  if (loginInCorso) return;
  loginInCorso = true; $("btnEntra").disabled = true;
  $("authMsg").innerHTML = "";
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) { $("authMsg").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    showApp();
  } catch (e) { $("authMsg").innerHTML = `<div class="msg err">Errore di accesso</div>`; }
  finally { loginInCorso = false; $("btnEntra").disabled = false; }
}
async function logout() { try { await sb.auth.signOut(); } catch (e) {} showLogin(); }

// ---- CONTROLS ----
function initControls() {
  const now = new Date();
  // Costo del mese: di base il mese scorso (il mese chiuso più recente)
  const prec = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  $("inAnno").value = now.getFullYear();
  $("selMese").innerHTML = MESI.map((m, i) => `<option value="${i + 1}" ${i === now.getMonth() ? "selected" : ""}>${m}</option>`).join("");
  $("cAnno").value = prec.getFullYear();
  $("cMese").innerHTML = MESI.map((m, i) => `<option value="${i + 1}" ${i === prec.getMonth() ? "selected" : ""}>${m}</option>`).join("");
}
// Solo i Dipendenti hanno la busta paga: gli Esterni (rapporto = 'esterno') non compaiono mai.
function erroreRapporto(e) {
  const txt = ((e && (e.code || "")) + " " + (e && (e.message || "")) + " " + (e && (e.details || ""))).toLowerCase();
  if (txt.includes("42703") || txt.includes("pgrst204") || (txt.includes("rapporto") && txt.includes("column"))) {
    return "Il database non ha ancora la colonna «rapporto» (database vecchio): impossibile distinguere Dipendenti ed Esterni. Paghe è bloccata per sicurezza. Avvisa il Direttore.";
  }
  return null;
}
function erroreOperai(testo) {
  $("selOperaio").innerHTML = `<option value="">Errore nel caricare le persone</option>`;
  $("selOperaio").disabled = true;
  $("avvisoOperai").innerHTML = `<div class="msg err">${testo}</div>`;
}
let elencoAttivi = [], elencoArchivio = [], nInForza = 0, archivioVisibile = false;
const nomeOperaio = (o) => `${o.cognome || ""} ${o.nome || ""}`;

async function loadOperai() {
  $("avvisoOperai").innerHTML = "";
  $("selOperaio").disabled = false;
  try {
    const { data: tutti, error } = await sb.from("operai").select("id,nome,cognome,agenzia,attivo,data_fine_rapporto")
      .eq("rapporto", "dipendente").order("cognome");
    if (error) throw error;
    if (!tutti || tutti.length === 0) {
      // zero dipendenti non e' un caso normale: errore a schermo, mai un elenco vuoto in silenzio
      erroreOperai("Nessun dipendente trovato. Può essere un problema di accesso (solo il titolare vede Paghe) o i dati mancano. Controlla di essere entrato con l'account giusto.");
      return;
    }
    const oggi = oggiSvizzera();
    elencoArchivio = tutti.filter(o => inArchivio(o, oggi));
    const inForza = tutti.filter(o => !inArchivio(o, oggi));
    // chi è in agenzia non ha una busta nostra (la fa l'agenzia): non si registra qui
    elencoAttivi = inForza.filter(o => o.agenzia !== true);
    nInForza = inForza.length;
    disegnaElenco();
    cambioPersona();
  } catch (e) {
    erroreOperai(erroreRapporto(e) || ("Errore nel caricare le persone: " + esc(e.message || e)));
  }
}

// Disegna l'elenco: attivi; con «Mostra archivio» anche gli ex, in un gruppo a parte con la scritta.
function disegnaElenco() {
  const oggi = oggiSvizzera();
  const n = elencoArchivio.length;
  const b = $("btnArchivio");
  b.classList.remove("hidden");
  b.textContent = `🗄️ ${archivioVisibile ? "Nascondi" : "Mostra"} archivio (${n})`;
  b.setAttribute("aria-pressed", archivioVisibile ? "true" : "false");
  let opz = elencoAttivi.map(o => `<option value="${esc(o.id)}">${esc(nomeOperaio(o))}</option>`).join("");
  if (archivioVisibile && n) {
    opz += `<optgroup label="Archivio (${n})">` + elencoArchivio.map(o => `<option value="${esc(o.id)}">${esc(nomeOperaio(o))} · ${esc(testoArchivio(o, oggi))}</option>`).join("") + `</optgroup>`;
  }
  $("selOperaio").disabled = false;
  $("avvisoOperai").innerHTML = "";
  if (!opz) {
    $("selOperaio").innerHTML = `<option value="">Nessuno in elenco</option>`;
    $("selOperaio").disabled = true;
    $("avvisoOperai").innerHTML = nInForza > 0
      ? `<div class="msg err">Tutti i dipendenti sono in agenzia: la busta la fa l'agenzia. Vedi «Costo del mese» → Agenzia.</div>`
      : `<div class="msg info">Nessun dipendente attivo. In archivio: ${n}.</div>`;
    return;
  }
  $("selOperaio").innerHTML = opz;
}

function cambiaArchivio() {
  if (archivioVisibile && (periodoArchivio || periodoNota) && voceNonSalvata() &&
      !confirm("Hai scritto una voce che non hai ancora aggiunto. Se esci la perdi. Uscire lo stesso?")) return;
  archivioVisibile = !archivioVisibile;
  if (!archivioVisibile && (periodoArchivio || periodoNota)) {   // si nasconde l'archivio: si esce anche dal periodo dell'ex
    periodo = null; periodoArchivio = null; periodoNota = null; voci = [];
    vaiA("registra", null);
  }
  disegnaElenco();
  if (archivioVisibile && elencoArchivio.length) $("selOperaio").value = elencoArchivio[0].id;
  if (archivioVisibile && !elencoArchivio.length) $("infoArchivio").innerHTML = `<div class="msg info">Nessuno in archivio.</div>`;
  else cambioPersona();
}

// Il tasto dice cosa succede per la persona e il mese scelti
function aggiornaTastoApri() {
  const o = elencoArchivio.find(x => x.id === $("selOperaio").value);
  const anno = parseInt($("inAnno").value, 10), mese = parseInt($("selMese").value, 10);
  const leggi = o && (o.agenzia === true || !anno || !mese || motivoArchivio(o, anno, mese));
  $("btnApri").textContent = leggi ? "👁️ Guarda il periodo (solo lettura)" : "📂 Apri periodo";
}

// Persona scelta nell'elenco: se è in archivio, scritta, fin dove si può scrivere e periodi salvati
async function cambioPersona() {
  const id = $("selOperaio").value;
  const o = elencoArchivio.find(x => x.id === id);
  const box = $("infoArchivio");
  if (!o) { aggiornaTastoApri(); box.innerHTML = ""; return; }
  // l'ex si apre sul mese della sua ultima busta
  const fine = fineRapporto(o);
  if (fine) { $("inAnno").value = Number(fine.slice(0, 4)); $("selMese").value = Number(fine.slice(5, 7)); }
  aggiornaTastoApri();
  box.innerHTML = `<div>${badgeArchivio(o)}</div><div class="muted">Carico i periodi…</div>`;
  await aggiornaListaPeriodi();
}
async function aggiornaListaPeriodi() {
  const id = $("selOperaio").value;
  const o = elencoArchivio.find(x => x.id === id);
  const box = $("infoArchivio");
  if (!o) return;
  const fine = fineRapporto(o);
  const { data, error } = await sb.from("tm_paghe_periodo").select("anno,mese,stato").eq("operaio_id", id)
    .order("anno", { ascending: false }).order("mese", { ascending: false });
  if ($("selOperaio").value !== id) return;           // nel frattempo è stata scelta un'altra persona
  const regola = o.agenzia === true ? "La busta la fa l'agenzia: solo lettura." : !fine ? "Senza data di fine: solo lettura."
    : `Ultima busta: si può scrivere fino a ${ultimoMeseScrivibile(o)}. Dopo: solo lettura.`;
  const testa = `<div>${badgeArchivio(o)}</div><div class="muted" style="margin-top:4px">${esc(regola)} Lo storico resta.</div>`;
  if (error) { box.innerHTML = testa + `<div class="msg err">Errore nel leggere i periodi: ${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { box.innerHTML = testa + `<div class="msg info">Nessun periodo salvato per questa persona.</div>`; return; }
  box.innerHTML = testa + `<div class="lista-periodi">` + data.map(p =>
    `<button class="btn sec" onclick="guardaPeriodo(${Number(p.anno)},${Number(p.mese)})">${p.stato === "chiuso" ? "🔒" : "✏️"} ${MESI[p.mese - 1]} ${Number(p.anno)} · ${p.stato === "chiuso" ? "chiuso" : "aperto"}</button>`).join("") + `</div>`;
}
function guardaPeriodo(anno, mese) {
  $("inAnno").value = anno; $("selMese").value = mese;
  return apriPeriodo();
}

// Controllo in piu' (anche se qualcuno apre una scheda per id): la persona deve essere un Dipendente.
// Ritorna true solo se rapporto = 'dipendente' e NON in agenzia (busta dell'agenzia).
// Lancia errore se la lettura fallisce o la colonna manca.
async function leggiStatoPersona(operaio_id) {
  const { data, error } = await sb.from("operai").select("id,rapporto,agenzia,attivo,data_fine_rapporto").eq("id", operaio_id).maybeSingle();
  if (error) throw error;
  if (!data) throw new Error("Persona non trovata o non accessibile.");
  return data;
}
async function verificaDipendente(operaio_id) {
  const data = await leggiStatoPersona(operaio_id);
  return data.rapporto === "dipendente" && data.agenzia !== true;
}
// Prima di ogni scrittura si rilegge la persona (può essere uscita mentre la pagina era aperta).
// Ritorna il motivo per cui non si può scrivere, o null se si può.
async function motivoNoScrittura(operaio_id, anno, mese) {
  const st = await leggiStatoPersona(operaio_id);
  if (st.rapporto !== "dipendente" || st.agenzia === true) return "Persona non Dipendente: nessuna riga paga.";
  return motivoArchivio(st, anno, mese);
}

// ---- PERIODO ----
async function apriPeriodo() {
  const operaio_id = $("selOperaio").value;
  const anno = parseInt($("inAnno").value, 10);
  const mese = parseInt($("selMese").value, 10);
  if (!operaio_id || !anno || !mese) { alert("Seleziona dipendente, anno e mese."); return; }
  try {
    const st = await leggiStatoPersona(operaio_id);
    if (st.rapporto === "dipendente" && inArchivio(st)) { await apriPeriodoArchivio(st, anno, mese); return; }
    if (st.rapporto !== "dipendente" || st.agenzia === true) {
      alert("Questa persona non ha una busta paga nostra: per gli Esterni non esiste busta paga, per chi è in agenzia la fa l'agenzia.");
      return;
    }
    periodoArchivio = null; periodoNota = null;
    const { data, error } = await sb.from("tm_paghe_periodo")
      .upsert({ operaio_id, anno, mese }, { onConflict: "operaio_id,anno,mese" })
      .select().single();
    if (error) throw error;
    periodo = data;
    await renderPeriodo();
    vaiA("registra", "periodo");
  } catch (e) {
    alert(erroreRapporto(e) || ("Errore nell'aprire il periodo: " + (e.message || e)));
  }
}

// Periodo di un ex. Dentro il limite si scrive; fuori si legge e basta.
// Un periodo che esiste già non si tocca all'apertura: guardarlo non cambia niente.
async function apriPeriodoArchivio(st, anno, mese) {
  const motivo = st.agenzia === true ? `${testoArchivio(st)}: la busta la fa l'agenzia, solo lettura.` : motivoArchivio(st, anno, mese);
  const { data: esiste, error } = await sb.from("tm_paghe_periodo").select("*")
    .eq("operaio_id", st.id).eq("anno", anno).eq("mese", mese).maybeSingle();
  if (error) throw error;
  let riga = esiste;
  if (!riga) {
    if (motivo) { alert(`${motivo} Nessun periodo in quel mese: non se ne crea uno nuovo.`); return; }
    const nuovo = await sb.from("tm_paghe_periodo").insert({ operaio_id: st.id, anno, mese }).select().single();
    if (nuovo.error) throw nuovo.error;
    riga = nuovo.data;
  }
  periodo = riga;
  periodoArchivio = motivo;
  periodoNota = motivo ? null : `${testoArchivio(st)}. Ultima busta: si può scrivere fino a ${ultimoMeseScrivibile(st)}.`;
  await renderPeriodo();
  if (!esiste) await aggiornaListaPeriodi();
  vaiA("registra", "periodo");
}

async function renderPeriodo() {
  $("periodoCard").classList.remove("hidden");
  msg("");
  const nomeOp = $("selOperaio").options[$("selOperaio").selectedIndex]?.text || "";
  $("periodoTitolo").textContent = `${nomeOp} — ${$("selMese").options[$("selMese").selectedIndex].text} ${periodo.anno}`;
  const chiuso = periodo.stato === "chiuso";
  $("periodoStato").innerHTML = `<span class="badge ${chiuso ? "chiuso" : "aperto"}">${chiuso ? "🔒 CHIUSO" : "✏️ APERTO"}</span>`;
  $("btnStato").textContent = chiuso ? "🔓 Riapri periodo" : "🔒 Chiudi periodo";
  const bloccato = chiuso || !!periodoArchivio;
  $("btnStato").classList.toggle("hidden", !!periodoArchivio);
  $("avvisoChiusura").innerHTML = "";
  $("periodoArchivio").innerHTML = (periodoArchivio || periodoNota) ? `<div class="msg info">🗄️ ${esc(periodoArchivio || periodoNota)}</div>` : "";
  $("addBox").style.display = bloccato ? "none" : "block";
  $("importBar").style.display = bloccato ? "none" : "block";
  $("importInfo").textContent = "";
  await loadVoci();
  // Import automatico alla prima apertura: se il periodo è aperto e non esiste
  // già la voce "ore da Cantiere", carica le ore da solo (senza sovrascrivere modifiche).
  // Per un ex solo se il periodo è vuoto: aprirlo per guardare non deve cambiare i soldi.
  if (!bloccato && !voci.some(v => v.tipo === "ore_ordinarie" && v.origine === "cantiere") && (!periodoNota || !voci.length)) {
    await importaOreCantiere();
  }
}

// ---- VOCI ----
async function loadVoci() {
  try {
    const { data, error } = await sb.from("tm_paghe_voce").select("*").eq("periodo_id", periodo.id).order("created_at");
    if (error) throw error;
    voci = data || [];
    renderVoci();
    await renderCostoPeriodo();
  } catch (e) {
    msg("Errore nel caricare le voci: " + esc(e.message || e), false);
  }
}

function renderVoci() {
  const chiuso = periodo.stato === "chiuso" || !!periodoArchivio;
  $("vociBody").innerHTML = voci.length ? voci.map(v => `
    <tr>
      <td><b>${esc(labelTipo(v.tipo))}</b></td>
      <td>${esc(v.descrizione || "")}</td>
      <td class="num" data-l="Quantità">${v.quantita != null ? fmt(v.quantita) : "—"}</td>
      <td data-l="UM">${esc(v.um || "")}</td>
      <td class="num" data-l="Importo CHF">${v.importo != null ? fmt(v.importo) : "⚠️ manca"}</td>
      <td class="num">${chiuso ? "" : `<button class="btn danger" style="padding:6px 10px;min-height:40px;font-size:15px" onclick="deleteVoce('${esc(v.id)}')">✕ Togli</button>`}</td>
    </tr>`).join("") : `<tr><td colspan="6"><div class="msg info">Nessuna voce in questo periodo.</div></td></tr>`;
  const tot = voci.reduce((s, v) => s + (Number(v.importo) || 0), 0);
  $("totale").textContent = fmt(tot);
}

// Costo per la ditta del periodo aperto (stessa regola della scheda «Costo del mese»)
async function renderCostoPeriodo() {
  const box = $("costoPeriodo");
  box.innerHTML = `<div class="muted">Calcolo del costo per la ditta…</div>`;
  try {
    const [parRighe, pers] = await Promise.all([leggiParametri(), leggiPersona(periodo.operaio_id)]);
    const P = scegliParametri(parRighe, periodo.anno, periodo.mese);
    const c = calcolaCosto({ anno: periodo.anno, mese: periodo.mese, voci, tipo_salario: pers.anag ? pers.anag.tipo_salario : null,
                             tariffa: pers.anag ? pers.anag.tariffa : null, occupazione: pers.anag ? pers.anag.percentuale_occupazione : null,
                             data_nascita: pers.dati ? pers.dati.data_nascita : null,
                             ruolo: pers.op ? pers.op.ruolo : null, data_assunzione: pers.op ? pers.op.data_assunzione : null,
                             data_fine_rapporto: pers.op ? pers.op.data_fine_rapporto : null, periodi: pers.periodi }, P);
    if (pers.erroreP) c.avvisi.push({ testo: AVVISO_PERIODI, tipo: "info" });
    if (!pers.anag) { c.completo = false; c.avvisi.unshift({ testo: "Anagrafica paghe mancante (tipo di salario e tariffa).", tipo: "err" }); }
    box.innerHTML = `<details class="persona" open><summary><span class="nome">💼 Costo per la ditta (stima)</span><span class="cifra">${fmt(c.costo)}</span></summary><div class="corpo">${htmlCosto(c)}</div></details>`;
  } catch (e) {
    box.innerHTML = `<div class="msg err">⚠️ Costo per la ditta non calcolato: ${esc(e.message || e)}</div>`;
  }
}

function labelTipo(t) {
  const map = { ore_ordinarie:"Ore ordinarie", straordinari:"Straordinari", indennita_trasferta:"Indennità trasferta/pasto (forfait)", salario_mensile:"Salario mensile", tredicesima:"13ª", premio:"Premio", assenza:"Assenza", correzione:"Correzione", altro:"Altro" };
  return map[t] || t;
}

async function addVoce() {
  try {
    const no = await motivoNoScrittura(periodo.operaio_id, periodo.anno, periodo.mese);
    if (no) { msg(esc(no), false); return; }
  } catch (e) { msg(erroreRapporto(e) || ("Errore nel controllo del rapporto: " + esc(e.message || e)), false); return; }
  const row = {
    periodo_id: periodo.id,
    tipo: $("vTipo").value,
    descrizione: $("vDesc").value.trim() || null,
    quantita: $("vQta").value !== "" ? parseFloat($("vQta").value) : null,
    um: $("vUm").value.trim() || null,
    importo: $("vImp").value !== "" ? parseFloat($("vImp").value) : null,
    origine: "manuale"
  };
  try {
    const { error } = await sb.from("tm_paghe_voce").insert(row).select().single();
    if (error) throw error;
    $("vDesc").value = ""; $("vQta").value = ""; $("vUm").value = ""; $("vImp").value = "";
    await loadVoci();
  } catch (e) {
    msg("Errore nell'aggiungere la voce: " + esc(e.message || e), false);
  }
}

async function deleteVoce(id) {
  if (!confirm("Togliere questa voce?")) return;
  try {
    const no = await motivoNoScrittura(periodo.operaio_id, periodo.anno, periodo.mese);
    if (no) { msg(esc(no), false); return; }
    const { error } = await sb.from("tm_paghe_voce").delete().eq("id", id);
    if (error) throw error;
    await loadVoci();
  } catch (e) {
    msg("Errore nel togliere la voce: " + esc(e.message || e), false);
  }
}

// ---- IMPORT ORE DAL CANTIERE ----
function meseRange(anno, mese) {
  const start = `${anno}-${String(mese).padStart(2, "0")}-01`;
  const ultimo = new Date(anno, mese, 0).getDate();
  const end = `${anno}-${String(mese).padStart(2, "0")}-${String(ultimo).padStart(2, "0")}`;
  return { start, end };
}

async function importaOreCantiere() {
  $("importInfo").textContent = "Importazione…";
  try {
    const no = await motivoNoScrittura(periodo.operaio_id, periodo.anno, periodo.mese);
    if (no) {
      $("importInfo").textContent = "";
      msg(esc(no), false);
      return;
    }
    const { start, end } = meseRange(periodo.anno, periodo.mese);
    const { data, error } = await sb.from("giornate")
      .select("ore_totali,pasto_riconosciuto")
      .eq("operaio_id", periodo.operaio_id)
      .gte("data", start).lte("data", end);
    if (error) throw error;
    const righe = data || [];
    if (righe.length === 0) { $("importInfo").textContent = "Nessuna giornata trovata in questo mese."; return; }
    const oreTot = +righe.reduce((s, g) => s + (Number(g.ore_totali) || 0), 0).toFixed(2);

    // tariffa dall'anagrafica, se presente (solo per operai a ore)
    let importo = null, notaTariffa = "";
    try {
      const { data: anag } = await sb.from("tm_paghe_anagrafica")
        .select("tariffa,tipo_salario").eq("operaio_id", periodo.operaio_id).maybeSingle();
      if (anag && anag.tipo_salario === "orario" && anag.tariffa != null) {
        importo = +(oreTot * Number(anag.tariffa)).toFixed(2);
      } else if (anag && anag.tipo_salario === "mensile") {
        notaTariffa = " (dipendente mensile: ore di riferimento, importo a parte)";
      } else {
        notaTariffa = " (tariffa non impostata: importo da compilare)";
      }
    } catch (e) { /* anagrafica opzionale in questa fase */ }

    const payload = {
      periodo_id: periodo.id,
      tipo: "ore_ordinarie",
      descrizione: `Ore da Cantiere (${righe.length} giornate)`,
      quantita: oreTot, um: "h", importo, origine: "cantiere"
    };
    const esistente = voci.find(v => v.tipo === "ore_ordinarie" && v.origine === "cantiere");
    if (esistente) {
      const { error: e2 } = await sb.from("tm_paghe_voce").update(payload).eq("id", esistente.id).select().single();
      if (e2) throw e2;
    } else {
      const { error: e3 } = await sb.from("tm_paghe_voce").insert(payload).select().single();
      if (e3) throw e3;
    }
    // Indennità pasto (forfait, fuori contributi): giorni con pasto riconosciuto × tariffa dell'App Cantieri
    let notaPasti = "";
    const nPasti = righe.filter(g => g.pasto_riconosciuto === true).length;
    const vPasti = voci.find(v => v.tipo === "indennita_trasferta" && v.origine === "cantiere");
    if (nPasti > 0 || vPasti) {
      let tar = null;
      try {
        const [TP, rOp] = await Promise.all([leggiTariffePasti(), sb.from("operai").select("ruolo").eq("id", periodo.operaio_id).maybeSingle()]);
        tar = tariffaPasto(rOp.data ? rOp.data.ruolo : null, TP);
      } catch (e) { tar = null; }
      const pp = { periodo_id: periodo.id, tipo: "indennita_trasferta", descrizione: `Indennità pasto da Cantiere (${nPasti} pasti)`,
                   quantita: nPasti, um: "pasti", importo: tar == null ? null : round2(nPasti * tar), origine: "cantiere" };
      const r = vPasti ? await sb.from("tm_paghe_voce").update(pp).eq("id", vPasti.id).select().single()
                       : await sb.from("tm_paghe_voce").insert(pp).select().single();
      if (r.error) throw r.error;
      notaPasti = ` · ${nPasti} pasti${tar == null ? " (tariffa pasto non impostata nell'App Cantieri: importo da compilare)" : ""}`;
    }
    $("importInfo").textContent = `Importate ${fmt(oreTot)} h da ${righe.length} giornate${notaTariffa}${notaPasti}.`;
    await loadVoci();
  } catch (e) {
    $("importInfo").textContent = "";
    msg(erroreRapporto(e) || ("Errore import ore: " + esc(e.message || e)), false);
  }
}

// ---- STATO PERIODO ----
// Giornata incompleta = senza orari in Cantieri (stessa regola dell'App Cantieri): conta 0 ore in busta.
// La timbratura in corso (cantiere_da_assegnare) non ha ancora gli orari per sua natura: non è incompleta.
function giornataIncompleta(g) { return !!g && g.cantiere_da_assegnare !== true && (!g.ora_inizio || !g.ora_fine); }

// Prima di chiudere: testo dell'avviso, o null se non c'è niente da dire. Mai un blocco.
async function avvisoGiornateIncomplete(p) {
  const { start, end } = meseRange(p.anno, p.mese);
  const { data, error } = await sb.from("giornate").select("data,ora_inizio,ora_fine,cantiere_da_assegnare")
    .eq("operaio_id", p.operaio_id).gte("data", start).lte("data", end).order("data");
  if (error) return `Giornate di ${MESI[p.mese - 1]} ${p.anno} NON controllate: ${error.message}.`;
  const inc = (data || []).filter(giornataIncompleta);
  if (!inc.length) return null;
  const date = [...new Set(inc.map(g => dataCH(String(g.data).slice(0, 10))))].join(", ");
  return `${inc.length === 1 ? "1 giornata incompleta" : inc.length + " giornate incomplete"} in ${MESI[p.mese - 1]} ${p.anno}: ${date}. Senza orari in Cantieri contano 0 ore in busta.`;
}
function annullaChiusura() { $("avvisoChiusura").innerHTML = ""; }

// conferma = true: «Chiudi lo stesso»
async function toggleStato(conferma) {
  const nuovo = periodo.stato === "chiuso" ? "aperto" : "chiuso";
  try {
    const no = await motivoNoScrittura(periodo.operaio_id, periodo.anno, periodo.mese);
    if (no) { msg(esc(no), false); return; }
    if (nuovo === "chiuso" && conferma !== true) {
      const avviso = await avvisoGiornateIncomplete(periodo);
      if (avviso) {
        $("avvisoChiusura").innerHTML = `<div class="msg err">⚠️ ${esc(avviso)}</div>
          <div class="row">
            <div><button class="btn danger" style="width:100%" onclick="toggleStato(true)">🔒 Chiudi lo stesso</button></div>
            <div><button class="btn sec" style="width:100%" onclick="annullaChiusura()">↩️ Annulla</button></div>
          </div>`;
        return;
      }
    }
    const { data, error } = await sb.from("tm_paghe_periodo")
      .update({ stato: nuovo, chiuso_at: nuovo === "chiuso" ? new Date().toISOString() : null, updated_at: new Date().toISOString() })
      .eq("id", periodo.id).select().single();
    if (error) throw error;
    periodo = data;
    await renderPeriodo();
    if (periodoNota) await aggiornaListaPeriodi();
  } catch (e) {
    msg("Errore nel cambiare stato: " + esc(e.message || e), false);
  }
}

checkAuth();
</script>
